<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #dee2e6;
            line-height: 1;
        }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 540px; width: 100%;">
        <div class="card-body text-center p-5">
            <div class="error-code mb-2">404</div>
            <h1 class="h3 text-dark mb-3">Page Not Found</h1>
            <p class="text-muted mb-1">The page you are looking for could not be found.</p>
            <p class="mb-4">
                <small class="text-secondary">
                    Requested path: <code th:text="${path}">unknown</code>
                </small>
            </p>
            <hr class="my-4">
            <a class="btn btn-primary" th:href="@{/}" role="button">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
